<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study Session · NET JRF PATH</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #1a1510; --paper: #f5f0e8; --accent: #c0392b; --accent-light: #e8d5c4; }
    body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink); padding: 2rem; display: flex; justify-content: center; }
    .card { background: white; padding: 2.5rem; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); max-width: 500px; width: 100%; }
    .tag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin: 1.5rem 0; }
    .tag-btn { padding: 0.8rem; border: 1px solid #ddd; border-radius: 10px; cursor: pointer; text-align: left; transition: all 0.2s; }
    .tag-btn.active { border-color: var(--accent); background: var(--accent-light); }
    button.start-btn { width: 100%; padding: 1rem; background: var(--ink); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="card" id="setupView">
  <h1>Choose Your Focus 🎯</h1>
  <p>Select tags to build your custom study session.</p>
  <div class="tag-grid" id="tagContainer">Loading tags...</div>
  <button class="start-btn" onclick="startStudySession()">Initialize Session</button>
</div>

<script>
  const SUPABASE_URL = 'https://rrxxthnfugzjhqjvbiyf.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyeHh0aG5mdWd6amhxanZiaXlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MDk3MzMsImV4cCI6MjA5NjM4NTczM30.R_r-PJ_VLI7-_yAswJTC6dhuokKQcNIrvNksfAfXIUQ';
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // 1. Fetch available tags
  async function loadTags() {
    const { data: tags } = await client.from('tags').select('*');
    const container = document.getElementById('tagContainer');
    container.innerHTML = tags.map(t => `
      <div class="tag-btn" onclick="this.classList.toggle('active')" data-id="${t.id}">
        ${t.name}
      </div>
    `).join('');
  }

  // 2. Fetch questions based on tags and redirect/start
  async function startStudySession() {
    const activeTags = Array.from(document.querySelectorAll('.tag-btn.active')).map(btn => btn.dataset.id);
    
    if (activeTags.length === 0) return alert("Select at least one tag!");

    // This fetches questions that are linked to the selected tags
    const { data: questions, error } = await client
      .from('questions')
      .select(`
        id, 
        question_text, 
        correct_answer,
        question_tags!inner(tag_id)
      `)
      .in('question_tags.tag_id', activeTags);

    if (error) { console.error(error); return; }
    
    // Here you would store the questions in localStorage or a state manager
    // and transition to your quiz engine interface
    localStorage.setItem('study_questions', JSON.stringify(questions));
    window.location.href = './quiz-engine.html'; 
  }

  loadTags();
</script>
</body>
</html>
